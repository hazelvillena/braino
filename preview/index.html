<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Braino · One thing at a time</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="preview-label"><span class="live-dot"></span> braino / your quiet little task space</div>
<main class="window"><div class="chrome" aria-hidden="true"><i></i><i></i><i></i></div><div class="content">
<header class="brand"><img src="/icon.png" alt=""><strong>braino</strong><button class="pin" title="Keep above other windows (Mac app)" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 6 0-1 6 4 4v2H6v-2l4-4zM12 15v6"/></svg><span>Keep on top</span></button></header>
<nav aria-label="Plan your tasks"></nav><div class="heading"><h1>Today</h1><span class="count">0</span></div><p class="subtitle"></p>
<div class="days" aria-label="Days this week" hidden></div>
<div class="list-tools"><label class="bucket-filter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2-3h9v15H3z"/></svg><select id="bucket-filter" aria-label="Filter by category"><option value="all">All categories</option></select></label><span class="list-hint">Small steps count.</span></div>
<section class="tasks" aria-label="Open tasks"></section>
<section class="completed-section"><button class="disclosure" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg>Completed <span class="completed-count">0</span></button><div class="completed-panel" hidden><div class="history-tools"><label>Show <select id="history-range" aria-label="Completed date filter"><option value="day">Past day</option><option value="week">Past week</option><option value="month">Past month</option><option value="all">All time</option><option value="custom">Custom range</option></select></label></div><div class="custom-dates" hidden><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label></div><div class="history"></div></div></section>
<div class="capture-wrap"><form class="capture"><button aria-label="Add task" title="Add task"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button><input id="new-task" aria-label="New task" placeholder="One thing on your mind…" maxlength="500" autocomplete="off"><button class="capture-options" type="button" aria-label="Task date and category" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg></button></form><div class="capture-details" hidden><label>When<input id="new-date" type="date"></label><label>Category <span>optional</span><input id="new-bucket" list="categories" placeholder="None" maxlength="40"></label><datalist id="categories"></datalist></div></div>
<footer><span>Take it easy. One thing at a time.</span><kbd>⌃ ⌥ Space</kbd></footer>
</div></main><div class="status" role="status" aria-live="polite"><span></span><button hidden>Undo</button></div>
<div class="preview-note">Local design preview · demo tasks stay in this browser.<br><button id="reset">Reset demo</button><span> · </span><button id="motion" aria-pressed="false">Reduce motion</button></div>
<script type="module" src="/app.mjs"></script></body></html>
