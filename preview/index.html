<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Braino · Design preview</title><link rel="icon" href="/icon.png"><style>
:root{color-scheme:light;--ink:#191816;--yellow:#f4c84a;--paper:#faf7ef}*{box-sizing:border-box}body{margin:0;background:#e8e5dd;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:grid;place-content:center;padding:35px 20px;gap:20px}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #8d6811;outline-offset:4px}.intro{text-align:center;color:#68655f;font-size:12px}.intro strong{color:#191816}.window{width:440px;max-width:calc(100vw - 32px);background:var(--paper);border:1px solid #fff9;border-radius:16px;box-shadow:0 25px 90px #25231c26;overflow:hidden}.chrome{height:35px;display:flex;gap:8px;align-items:center;padding:0 16px}.dot{width:11px;height:11px;border-radius:50%;background:#ff6059}.dot:nth-child(2){background:#ffbd2e}.dot:nth-child(3){background:#28c840}.content{padding:12px 25px 23px;display:flex;flex-direction:column;min-height:590px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:27px}.brand img{width:42px;height:42px;object-fit:contain}.brand strong{font-size:25px;letter-spacing:-1px;font-weight:800}.pin{margin-left:auto;background:#19181608;border-radius:50%;width:34px;height:34px;font-size:17px}.pin.active{background:var(--yellow)}nav{display:flex;align-self:flex-start;gap:4px;border-radius:50px;background:#1918160a;padding:4px}nav button{background:transparent;border-radius:30px;padding:10px 14px;font-size:12px;color:#77736b}nav button.active{background:var(--yellow);color:var(--ink);font-weight:600}.heading{display:flex;align-items:center;justify-content:space-between;margin-top:27px}.heading h1{font:36px Georgia,serif;margin:0 0 5px}.sub{color:#8b877f;font-size:12px;margin:0 0 22px}.count{background:#f4c84a88;border-radius:50%;min-width:30px;height:30px;text-align:center;padding-top:7px}.tasks{display:flex;flex-direction:column;gap:8px;flex:1;margin-bottom:20px;max-height:360px;overflow:auto}.task{background:#ffffffb8;border-radius:12px;padding:14px;display:flex;align-items:start;gap:11px}.check{border:1.5px solid #b9b6af;border-radius:50%;width:20px;height:20px;flex-shrink:0;background:none;padding:0}.check.done{background:var(--ink);color:var(--yellow);border-color:var(--ink)}.taskbody{flex:1;min-width:0}.title{width:100%;padding:1px 0;background:none;border:0;font-size:14px}.completed .title{text-decoration:line-through;color:#8b877f}.note{font-size:12px;color:#8b877f;margin-top:7px;border:0;background:none;width:100%;resize:vertical;min-height:30px}.sun,.more{background:none;color:#aaa59a;padding:1px;font-size:17px}.sun.active{color:#191816}.empty{text-align:center;padding:50px 0;color:#8b877f}.empty img{width:65px;height:65px}.empty h2{font:19px Georgia,serif;color:#191816}.capture{display:flex;align-items:center;gap:10px;background:white;border:1.5px solid #f4c84abf;border-radius:13px;padding:14px}.capture button{width:28px;height:28px;border-radius:8px;background:var(--yellow);font-size:21px}.capture input{min-width:0;flex:1;border:0;background:transparent;outline:none;font-size:14px}.capture span{color:#aaa}.footer{display:flex;justify-content:space-between;color:#b2ada3;font-size:9px;letter-spacing:1.5px;margin-top:18px}.caption{text-align:center;font-size:11px;color:#777269;max-width:440px;line-height:1.7}.tools{display:flex;justify-content:center;gap:18px}.tools button{background:none;color:#777269;font-size:11px;text-decoration:underline}.toast{min-height:16px;text-align:center;font-size:11px;color:#68655f}@media(max-width:480px){body{padding:16px 0}.content{padding:12px 20px 20px;min-height:570px}}
</style><div class="intro"><strong>Braino</strong> / local design preview</div><main class="window"><div class="chrome" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="content"><header class="brand"><img src="/icon.png" alt="Braino transparent brain icon"><strong>braino</strong><button class="pin" aria-label="Preview pin state" aria-pressed="false">♧</button></header><nav aria-label="Task views"></nav><div class="heading"><h1>Today</h1><span class="count">0</span></div><p class="sub"></p><section class="tasks" aria-label="Tasks"></section><form class="capture"><button aria-label="Add task">+</button><input aria-label="New task" placeholder="What’s on your mind?" maxlength="500"><span>↵</span></form><footer class="footer"><span>ONE THING AT A TIME</span><span>⌃ ⌥ SPACE</span></footer></div></main><div class="caption">Interactive browser approximation of the Mac app.<br>Preview tasks stay in this browser, separate from your real tasks.<br>The global shortcut and always-on-top behavior belong to the native app.</div><div class="tools"><button id="reset">Reset demo tasks</button><button id="bg">Toggle backdrop</button></div><div class="toast" role="status"></div><script>
const initial=()=>[{id:crypto.randomUUID(),title:'Make space for a good idea',today:true,completed:false,notes:''},{id:crypto.randomUUID(),title:'A little progress on Braino',today:true,completed:false,notes:'One small step is enough.'},{id:crypto.randomUUID(),title:'Take a proper screen break',today:true,completed:false,notes:''}];
let tasks;try{tasks=JSON.parse(localStorage.getItem('braino-preview-v1'))}catch{}if(!Array.isArray(tasks))tasks=initial();let view='Today';const $=s=>document.querySelector(s);const save=()=>{try{localStorage.setItem('braino-preview-v1',JSON.stringify(tasks))}catch{$('.toast').textContent='Browser storage unavailable; changes last for this visit.'}};
function render(){const nav=$('nav');nav.replaceChildren();for(const [name,icon] of [['Today','☼'],['Inbox','▱'],['Logbook','✓']]){const b=document.createElement('button');b.textContent=icon+'  '+name;b.className=view===name?'active':'';b.setAttribute('aria-pressed',view===name);b.onclick=()=>{view=name;render()};nav.append(b)}$('h1').textContent=view;$('.sub').textContent=view==='Today'?new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(new Date()):view==='Inbox'?'A little space for everything on your mind.':'Look how far you’ve come.';const shown=tasks.filter(t=>view==='Logbook'?t.completed:!t.completed&&(view!=='Today'||t.today));$('.count').textContent=shown.length;const list=$('.tasks');list.replaceChildren();for(const t of shown){const row=document.createElement('article');row.className='task'+(t.completed?' completed':'');const check=document.createElement('button');check.className='check'+(t.completed?' done':'');check.textContent=t.completed?'✓':'';check.setAttribute('aria-label',(t.completed?'Reopen ':'Complete ')+t.title);check.onclick=()=>{t.completed=!t.completed;save();render()};const body=document.createElement('div');body.className='taskbody';const title=document.createElement('input');title.className='title';title.value=t.title;title.setAttribute('aria-label','Task title');title.onchange=()=>{t.title=title.value;save()};body.append(title);if(t.notes||t.expanded){const note=document.createElement('textarea');note.className='note';note.value=t.notes||'';note.placeholder='Add a note…';note.setAttribute('aria-label','Task notes');note.oninput=()=>{t.notes=note.value;save()};body.append(note)}const sun=document.createElement('button');sun.className='sun'+(t.today?' active':'');sun.textContent='☼';sun.setAttribute('aria-label',t.today?'Remove from Today':'Move to Today');sun.onclick=()=>{t.today=!t.today;save();render()};const more=document.createElement('button');more.className='more';more.textContent='⋯';more.setAttribute('aria-label','Toggle notes');more.onclick=()=>{t.expanded=!t.expanded;render()};row.append(check,body,sun,more);list.append(row)}if(!shown.length){const empty=document.createElement('div');empty.className='empty';const img=document.createElement('img');img.src='/icon.png';img.alt='';const title=document.createElement('h2');title.textContent=view==='Logbook'?'Small steps add up.':'Make room for what matters.';const text=document.createElement('p');text.textContent=view==='Logbook'?'Completed tasks will find a home here.':'Add a task below. Take it one thing at a time.';empty.append(img,title,text);list.append(empty)}$('.capture').hidden=view==='Logbook';$('.capture').style.display=view==='Logbook'?'none':'flex'}
$('.capture').onsubmit=e=>{e.preventDefault();const input=$('.capture input');if(!input.value.trim())return;tasks.unshift({id:crypto.randomUUID(),title:input.value.trim(),today:view==='Today',completed:false,notes:''});input.value='';save();render();input.focus()};$('.pin').onclick=()=>{const on=$('.pin').classList.toggle('active');$('.pin').setAttribute('aria-pressed',on);$('.toast').textContent='Pin appearance only. Always-on-top works in the Mac app.'};$('#reset').onclick=()=>{tasks=initial();save();render()};let dark=false;$('#bg').onclick=()=>{dark=!dark;document.body.style.background=dark?'#292824':'#e8e5dd'};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&e.code==='Space'){e.preventDefault();if(view==='Logbook'){view='Today';render()}$('.capture input').focus()}});render();
</script></html>
